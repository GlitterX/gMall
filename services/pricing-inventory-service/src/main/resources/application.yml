spring:
  application:
    name: pricing-inventory-service
  config:
    import: "optional:nacos:gmall-pricing-inventory.yml?group=GMALL&refreshEnabled=true"
  datasource:
    url: ${GMALL_PRICING_INVENTORY_DB_URL:jdbc:postgresql://127.0.0.1:5432/gmall}
    username: ${GMALL_PRICING_INVENTORY_DB_USERNAME:gmall}
    password: ${GMALL_PRICING_INVENTORY_DB_PASSWORD:gmall}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    nacos:
      config:
        enabled: ${GMALL_NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: ${GMALL_NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    sentinel:
      enabled: ${GMALL_SENTINEL_ENABLED:false}
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8080}
    stream:
      rocketmq:
        binder:
          name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
server:
  port: ${SERVER_PORT:18083}
management:
  endpoints:
    web:
      exposure:
        include: health,info
seata:
  enabled: ${GMALL_SEATA_ENABLED:false}
  application-id: ${spring.application.name}
  tx-service-group: ${GMALL_SEATA_TX_GROUP:gmall-pricing-inventory-tx-group}
gmall:
  catalog-service:
    base-url: ${GMALL_CATALOG_SERVICE_BASE_URL:http://127.0.0.1:18082/api/catalog}
  foundation-service:
    base-url: ${GMALL_FOUNDATION_SERVICE_BASE_URL:http://127.0.0.1:18081/api/foundation}
